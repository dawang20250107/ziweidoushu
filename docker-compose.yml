# 单机部署编排。API 无状态,横向扩容时在前面加任意负载均衡即可。
services:
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      RATE_LIMIT_RPS: "50"
      RATE_LIMIT_BURST: "100"
      CHART_CACHE_SIZE: "8192"
      # 用户体系(注释掉两项即回到无库模式)
      DATABASE_URL: "postgres://ziwei:ziwei-local-dev@db:5432/ziwei"
      JWT_SECRET: "change-me-to-a-random-32byte-secret!!"
      # AI 解读(不配置则自动降级为知识库规则版)
      # ANTHROPIC_API_KEY: "sk-..."
      # 或 OpenAI 兼容(DeepSeek 示例):
      # OPENAI_API_KEY: "sk-..."
      # OPENAI_BASE_URL: "https://api.deepseek.com/v1"
      # OPENAI_MODEL: "deepseek-chat"
      # 外部古籍目录(后期投放古籍/倪师著作)
      CORPUS_EXTERNAL_DIR: "/corpus"
      # ADMIN_TOKEN: "change-me"  # 开启语料热加载接口
    volumes:
      - ./corpus-external:/corpus:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ziwei
      POSTGRES_PASSWORD: ziwei-local-dev
      POSTGRES_DB: ziwei
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziwei"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
